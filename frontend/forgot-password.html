<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RoboDog | Forgot Password</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <div class="auth-container">


        <!-- Logo -->

        <div class="logo-section">

            <div class="logo-icon">
                🐕
            </div>

            <h1>
                RoboDog
            </h1>

        </div>


        <!-- Heading -->

        <h2>
            Forgot Password?
        </h2>


        <p class="auth-description">

            Enter your registered email address and we'll send you
            a verification OTP.

        </p>


        <!-- Email Form -->

        <form id="forgotPasswordForm">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                required
            >

            <button
                type="submit"
                class="primary-btn"
            >
                Send OTP
            </button>

        </form>


        <!-- OTP Section -->

        <div
            id="otpSection"
            class="otp-section"
        >

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
            >

            <!-- OTP Timer -->

            <p
                id="otpTimer"
                class="otp-timer"
            >
                OTP expires in: 05:00
            </p>


            <button
                type="button"
                id="verifyOtpBtn"
                class="primary-btn"
            >
                Verify OTP
            </button>

        </div>


        <!-- New Password Section -->

        <div
            id="passwordSection"
            class="password-section"
        >

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your new password"
            >


            <button
                type="button"
                id="resetPasswordBtn"
                class="primary-btn"
            >
                Reset Password
            </button>

        </div>


        <!-- Message -->

        <p
            id="message"
            class="form-message"
        >
        </p>


        <!-- Back to Login -->

        <p class="back-login">

            Remember your password?

            <a href="login.html">
                Back to Login
            </a>

        </p>


    </div>


    <script src="forgot-password.js"></script>


</body>

</html>
