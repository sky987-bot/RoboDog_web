<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RoboDog - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🐕 RoboDog</h1>
        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <!-- Forgot Password -->
            <p class="forgot-link">
                <a href="forgot-password.html">Forgot Password?</a>
            </p>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p class="register-link">
            Don't have an account?
            <a href="index.html">Register here</a>
        </p>

    </div>

    <script src="login.js"></script>

</body>
</html>
